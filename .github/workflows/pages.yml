# Publishes the player to GitHub Pages on every push to main.
#
# The actions used here are pinned to exact commits by .github/workflows/actions.lock, which GitHub
# Actions enforces when the job starts. Update it with `gh actions-lock` whenever an action is added,
# removed or changed. The verify job checks the lockfile first, and the site is only published if it
# passes.
#
# Before publishing, the "?v=dev" on the CSS and script links in index.html is replaced with the commit
# id. Browsers may cache those files for a while, so a new id makes them fetch the new versions together
# with the new page instead of mixing old and new files.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Fails if the lockfile is incomplete, or if a locked commit is no longer what its tag points to,
      # no longer exists, or comes from a renamed or transferred repository. Also fails if the lockfile
      # tooling itself goes away. The extension is pinned so the checker cannot change unnoticed.
      - name: Verify the actions lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.2.0
          gh actions-lock --verify

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Build the site with versioned file links
        run: |
          mkdir _site
          cp -R index.html favicon.svg LICENSE css js data fonts _site/
          version="${GITHUB_SHA::7}"
          sed -i "s/?v=dev/?v=${version}/g" _site/index.html
          if grep -q '?v=dev' _site/index.html; then echo "index.html still has ?v=dev" >&2; exit 1; fi
          grep -o "?v=${version}" _site/index.html | wc -l

      - uses: actions/configure-pages@v6.0.0

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5.0.1
